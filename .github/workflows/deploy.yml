name: Deploy to Vercel

# Објавува нова продукциска верзија на Vercel при секој push на main.
# Активира се штом ќе постои секретот VERCEL_TOKEN:
# Settings -> Secrets and variables -> Actions -> New repository secret.
# Додека секретот не постои, workflow-от успешно се прескокнува (зелено, без деплој).
#
# Забелешка: намерно се користи `vercel deploy --prod` (билд на Vercel), а не
# `vercel build` + `--prebuilt`. Локалниот prebuilt излез за чисто статичен
# проект погрешно рутираше `/` и `/en` кон 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_E4YEdET1NkwUMexjwSciAnmC' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_VlXqMz6Al5s03NSb4OKSeySrvHRl' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check for VERCEL_TOKEN
        id: check
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add a VERCEL_TOKEN repository secret to enable automatic deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Deploy to production
        if: steps.check.outputs.ready == 'true'
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
